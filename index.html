<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Insight — 投資指標分析</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Stock Insight" />
  <meta name="theme-color" content="#58a6ff" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --border: #30363d;
      --border2: #21262d;
      --text: #e6edf3;
      --text2: #8b949e;
      --text3: #6e7681;
      --accent: #58a6ff;
      --accent-dim: rgba(88,166,255,0.12);
      --green: #3fb950;
      --green-dim: rgba(63,185,80,0.12);
      --yellow: #d29922;
      --yellow-dim: rgba(210,153,34,0.12);
      --red: #f85149;
      --red-dim: rgba(248,81,73,0.12);
      --gray-dim: rgba(139,148,158,0.1);
      --radius: 8px;
    }

    html { background: var(--bg); color: var(--text); }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100dvh;
      background: var(--bg);
    }

    /* ===== Header ===== */
    .s-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .s-logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .s-logo span { color: var(--text2); font-weight: 400; }

    .s-settings-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text2);
      font-size: 18px;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: var(--radius);
      transition: all 0.15s;
    }
    .s-settings-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ===== Settings Panel ===== */
    .s-settings-panel {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: none;
    }
    .s-settings-panel.open { display: block; }

    .s-settings-row {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 600px;
    }

    .s-settings-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text2);
      white-space: nowrap;
    }

    .s-api-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 7px 12px;
      border-radius: var(--radius);
      outline: none;
    }
    .s-api-input:focus { border-color: var(--accent); }

    .s-save-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      white-space: nowrap;
    }
    .s-save-btn:hover { opacity: 0.85; }

    .s-settings-hint {
      font-size: 11px;
      color: var(--text3);
      margin-top: 8px;
    }

    /* ===== Main ===== */
    .s-main {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    /* ===== Search ===== */
    .s-search-wrap {
      margin-bottom: 32px;
    }

    .s-search-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .s-search-sub {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 16px;
    }

    .s-search-row {
      display: flex;
      gap: 10px;
    }

    .s-search-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 16px;
      padding: 12px 16px;
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.15s;
    }
    .s-search-input:focus { border-color: var(--accent); }
    .s-search-input::placeholder { color: var(--text3); }

    .s-search-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: var(--radius);
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .s-search-btn:hover { opacity: 0.85; }
    .s-search-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ===== Status ===== */
    .s-status {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 24px;
      font-size: 14px;
      color: var(--text2);
    }

    .s-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .s-error {
      background: var(--red-dim);
      border-color: var(--red);
      color: var(--red);
    }

    /* ===== Company Header ===== */
    .s-company-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 16px;
      justify-content: space-between;
    }

    .s-company-info {}

    .s-company-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .s-company-name-en {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text2);
      margin-top: 2px;
    }

    .s-company-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .s-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--text2);
    }

    .s-tag-ticker {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .s-company-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }

    .s-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border);
      color: var(--text2);
      background: var(--surface2);
      transition: all 0.15s;
      white-space: nowrap;
      cursor: pointer;
    }
    .s-link-btn:hover { border-color: var(--accent); color: var(--accent); }
    .s-link-btn-yahoo { border-color: rgba(255,48,48,0.4); color: #ff6060; }
    .s-link-btn-yahoo:hover { border-color: #ff6060; background: rgba(255,96,96,0.1); }
    .s-link-btn-bbs { border-color: rgba(88,166,255,0.4); color: var(--accent); }
    .s-link-btn-bbs:hover { border-color: var(--accent); background: var(--accent-dim); }

    /* ===== Metrics Grid ===== */
    .s-section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text3);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .s-metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .s-metrics-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .s-metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }
    .s-metric-card:hover { border-color: var(--accent); }
    .s-metric-card.expanded { border-color: var(--accent); background: var(--surface2); }

    .s-metric-card.rating-good { border-left: 3px solid var(--green); }
    .s-metric-card.rating-warn { border-left: 3px solid var(--yellow); }
    .s-metric-card.rating-bad  { border-left: 3px solid var(--red); }
    .s-metric-card.rating-na   { border-left: 3px solid var(--border); }

    .s-metric-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .s-metric-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text2);
      font-weight: 600;
    }

    .s-metric-rating {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
    }
    .s-metric-rating.good { background: var(--green-dim); color: var(--green); }
    .s-metric-rating.warn { background: var(--yellow-dim); color: var(--yellow); }
    .s-metric-rating.bad  { background: var(--red-dim); color: var(--red); }
    .s-metric-rating.na   { background: var(--gray-dim); color: var(--text3); }

    .s-metric-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      margin-bottom: 2px;
    }

    .s-metric-unit {
      font-size: 13px;
      font-weight: 400;
      color: var(--text2);
      margin-left: 2px;
    }

    .s-metric-asof {
      font-size: 10px;
      color: var(--text3);
      font-family: 'JetBrains Mono', monospace;
    }

    .s-metric-expand {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border2);
      display: none;
    }
    .s-metric-card.expanded .s-metric-expand { display: block; }

    .s-metric-full-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .s-metric-desc {
      font-size: 12px;
      color: var(--text2);
      line-height: 1.7;
      margin-bottom: 8px;
    }

    .s-metric-bench {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text3);
      background: var(--bg);
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid var(--border2);
    }

    .s-metric-chevron {
      font-size: 10px;
      color: var(--text3);
      float: right;
      margin-top: 2px;
    }

    /* ===== Analysis ===== */
    .s-analysis-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }

    .s-analysis-text {
      font-size: 14px;
      color: var(--text2);
      line-height: 1.8;
      margin-bottom: 16px;
    }

    .s-str-risk-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 500px) {
      .s-str-risk-grid { grid-template-columns: 1fr; }
    }

    .s-str-panel, .s-risk-panel {
      padding: 12px;
      border-radius: var(--radius);
    }

    .s-str-panel {
      background: var(--green-dim);
      border: 1px solid rgba(63,185,80,0.25);
    }

    .s-risk-panel {
      background: var(--red-dim);
      border: 1px solid rgba(248,81,73,0.25);
    }

    .s-str-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .s-risk-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--red);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .s-str-item, .s-risk-item {
      font-size: 12px;
      line-height: 1.6;
      padding: 3px 0;
    }

    .s-str-item { color: var(--green); }
    .s-risk-item { color: var(--red); }

    /* ===== Price Bar ===== */
    .s-price-bar {
      border-top: 1px solid var(--border2);
      margin-top: 16px;
      padding-top: 14px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .s-price-main {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .s-price-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    .s-price-currency {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text2);
    }

    .s-price-change {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .s-price-change.up   { color: var(--green); background: var(--green-dim); }
    .s-price-change.down { color: var(--red);   background: var(--red-dim); }
    .s-price-change.flat { color: var(--text2); background: var(--gray-dim); }

    .s-price-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-left: auto;
    }

    .s-price-meta-item {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text3);
    }

    .s-price-meta-item span {
      color: var(--text2);
      margin-left: 4px;
    }

    .s-price-live {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--green);
      background: var(--green-dim);
      border: 1px solid rgba(63,185,80,0.3);
      padding: 2px 7px;
      border-radius: 3px;
      letter-spacing: 1px;
      animation: pulse-live 2s ease-in-out infinite;
    }

    @keyframes pulse-live {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .s-price-loading {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text3);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .s-price-no-key {
      font-size: 12px;
      color: var(--text3);
    }

    .s-price-no-key a {
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
    }

    /* ===== Disclaimer ===== */
    .s-disclaimer {
      background: var(--yellow-dim);
      border: 1px solid rgba(210,153,34,0.3);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 12px;
      color: var(--yellow);
      line-height: 1.6;
    }

    .s-disclaimer strong {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 4px;
    }

    /* ===== Source Badge ===== */
    .s-metric-source {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--gray-dim);
      color: var(--text3);
      white-space: nowrap;
    }
    .s-metric-source.real {
      background: var(--green-dim);
      color: var(--green);
    }

    /* ===== History Section ===== */
    .s-hist-loading {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text3);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 0;
    }

    .s-hist-na {
      font-size: 12px;
      color: var(--text3);
      padding: 12px 0;
    }

    .s-hist-chart {
      width: 100%;
      overflow-x: auto;
      margin-bottom: 12px;
    }

    .s-hist-legend {
      display: flex;
      gap: 16px;
      margin-bottom: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text2);
    }

    .s-legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .s-legend-bar {
      display: inline-block;
      width: 14px;
      height: 10px;
      border-radius: 2px;
      opacity: 0.75;
    }

    .s-legend-line {
      display: inline-block;
      width: 14px;
      height: 2px;
      border-radius: 1px;
    }

    .s-hist-table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border2);
    }

    .s-hist-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .s-hist-table th {
      background: var(--surface2);
      color: var(--text2);
      font-size: 10px;
      letter-spacing: 1px;
      padding: 8px 10px;
      text-align: right;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .s-hist-table th:first-child { text-align: left; }

    .s-hist-table td {
      padding: 7px 10px;
      text-align: right;
      color: var(--text2);
      border-bottom: 1px solid var(--border2);
    }

    .s-hist-table td:first-child { text-align: left; color: var(--text3); }
    .s-hist-table tr:last-child td { border-bottom: none; }
    .s-hist-table tr:nth-child(even) td { background: rgba(255,255,255,0.01); }

    .s-hist-table td.good { color: var(--green); }
    .s-hist-table td.warn { color: var(--yellow); }
    .s-hist-table td.bad  { color: var(--red); }

    /* ===== Hidden ===== */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="s-header">
    <div class="s-logo">STOCK<span>INSIGHT</span></div>
    <button class="s-settings-btn" title="API設定" onclick="toggleSettings()">⚙</button>
  </header>

  <!-- ===== Settings Panel ===== -->
  <div class="s-settings-panel" id="settings-panel">
    <div class="s-settings-row">
      <span class="s-settings-label">ANTHROPIC</span>
      <input type="password" class="s-api-input" id="api-key-input" placeholder="sk-ant-...（AI分析）" />
    </div>
    <div class="s-settings-row" style="margin-top:8px">
      <span class="s-settings-label">AV KEY</span>
      <input type="password" class="s-api-input" id="av-key-input" placeholder="Alpha Vantage キー（株価専用）" />
    </div>
    <div class="s-settings-row" style="margin-top:8px">
      <span class="s-settings-label">FMP KEY</span>
      <input type="password" class="s-api-input" id="fmp-key-input" placeholder="Financial Modeling Prep キー（財務指標）" />
    </div>
    <div style="margin-top:10px">
      <button class="s-save-btn" onclick="saveAllKeys()">保存</button>
    </div>
    <div class="s-settings-hint" style="margin-top:6px">
      AV: 株価のみ（<a href="https://www.alphavantage.co/support/#api-key" target="_blank" rel="noopener" style="color:var(--accent)">無料取得</a> · 25回/日）
      · FMP: 米国株財務指標（<a href="https://financialmodelingprep.com/register" target="_blank" rel="noopener" style="color:var(--accent)">無料取得</a> · 250回/日）
    </div>
    <div style="border-top:1px solid var(--border2);margin:14px 0 10px;padding-top:12px">
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:2px;margin-bottom:10px">
        J-QUANTS — 日本株財務データ（JPX公式・無料）
      </div>
      <div class="s-settings-row">
        <span class="s-settings-label">API KEY</span>
        <input type="password" class="s-api-input" id="jq-api-key-input" placeholder="J-Quants APIキー" />
      </div>
      <div style="margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <button class="s-save-btn" onclick="saveJQApiKey()">APIキーを保存</button>
        <span id="jq-status" style="font-size:11px;font-family:'JetBrains Mono',monospace"></span>
      </div>
      <div class="s-settings-hint" style="margin-top:6px">
        <a href="https://jpx-jquants.com/" target="_blank" rel="noopener" style="color:var(--accent)">jpx-jquants.com</a>
        にログイン後、設定メニュー「API Key」からコピーして貼り付けてください（V2 API）
      </div>
    </div>
    <div class="s-settings-hint">全キーはブラウザのローカルストレージにのみ保存されます</div>
  </div>

  // ===== Search =====
  async function analyzeStock() {
    const query = document.getElementById('search-input').value.trim();
    if (!query) { showError('企業名または証券コードを入力してください'); return; }

    const apiKey = localStorage.getItem(API_KEY_STORAGE) || document.getElementById('api-key-input').value.trim();
    if (!apiKey) {
      toggleSettings();
      showError('⚙ API キーを設定してください');
      return;
    }

    showStatus('Claude AI が企業情報を分析しています...');
    document.getElementById('search-btn').disabled = true;
    document.getElementById('result-area').classList.add('hidden');

    try {
      const data = await callClaude(query, apiKey);
      currentResult = data;
      renderResult(data);
    } catch (e) {
      showError('エラー: ' + (e.message || '不明なエラー'));
    } finally {
      document.getElementById('search-btn').disabled = false;
    }

  // ===== Claude API =====
  async function callClaude(query, apiKey) {
    const prompt = `You are a financial data analyst specializing in Japanese stocks. The user searched for: "${query}"

Return ONLY valid JSON (no markdown, no explanation) matching this exact structure:

{
  "found": true,
  "company_name": "正式日本語社名",
  "company_name_en": "Official English name",
  "ticker": "証券コード (e.g. 7203 for JP, AAPL for US)",
  "market": "東証プライム / 東証スタンダード / NYSE / NASDAQ など",
  "sector": "業種（日本語）",
  "country": "JP or US",
  "metrics": {
    "per": { "value": 14.5, "as_of": "FY2024" },
    "pbr": { "value": 1.2, "as_of": "FY2024" },
    "roe": { "value": 18.5, "as_of": "FY2024" },
    "roa": { "value": 5.2, "as_of": "FY2024" },
    "equity_ratio": { "value": 43.2, "as_of": "FY2024" },
    "operating_margin": { "value": 9.5, "as_of": "FY2024" },
    "dividend_yield": { "value": 2.1, "as_of": "直近" },
    "market_cap": { "value": 400000, "as_of": "概算", "unit": "億円" },
    "revenue": { "value": 450000, "as_of": "FY2024", "unit": "億円" }
  },
  "analysis": "150〜200字の投資分析（日本語）",
  "strengths": ["強み1", "強み2", "強み3"],
  "risks": ["リスク1", "リスク2", "リスク3"],
  "yahoo_finance_jp_url": "https://finance.yahoo.co.jp/quote/7203.T",
  "yahoo_bbs_url": "https://finance.yahoo.co.jp/cm/message/1017203",
  "data_note": "データの時点や精度に関する注記（簡潔に）"
}

For US stocks: use "百万ドル" as unit for market_cap and revenue. For JP stocks: use "億円".
If the company is not found or ambiguous, return: { "found": false, "message": "理由（日本語）" }
Use your training data for approximate figures. All values are estimates for educational purposes.`;

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1200,
        messages: [{ role: 'user', content: prompt }],
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const body = await res.json();
    const text = body.content[0].text.trim();

    // Strip markdown fences if present
    const cleaned = text.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim();
    const data = JSON.parse(cleaned);
    return data;
  }

  // ===== Render =====
  function renderResult(data) {
    hideStatus();
    const area = document.getElementById('result-area');

    if (!data.found) {
      area.innerHTML = `
        <div class="s-status s-error">
          <span>❌ ${data.message || '企業が見つかりませんでした'}</span>
        </div>`;
      area.classList.remove('hidden');
      return;
    }

    area.innerHTML = '';

    // Disclaimer
    const disc = document.createElement('div');
    disc.className = 's-disclaimer';
    disc.innerHTML = `<strong>⚠ AI データに関する注意</strong>
      このデータは Claude AI のトレーニングデータに基づく推定値です。リアルタイムデータではなく、実際の投資判断には必ず公式財務諸表・最新データをご確認ください。
      ${data.data_note ? '<br><em>' + data.data_note + '</em>' : ''}`;
    area.appendChild(disc);

    // Company header
    const m = data.metrics || {};
    const yUrl = data.yahoo_finance_jp_url || '';
    const bUrl = data.yahoo_bbs_url || '';

    const hdr = document.createElement('div');
    hdr.className = 's-company-header';
    hdr.innerHTML = `
      <div class="s-company-info">
        <div class="s-company-name">${esc(data.company_name)}</div>
        <div class="s-company-name-en">${esc(data.company_name_en || '')}</div>
        <div class="s-company-tags">
          <span class="s-tag s-tag-ticker">${esc(data.ticker || '')}</span>
          <span class="s-tag">${esc(data.market || '')}</span>
          <span class="s-tag">${esc(data.sector || '')}</span>
        </div>
      </div>
      <div class="s-company-links">
        ${yUrl ? `<a href="${esc(yUrl)}" target="_blank" rel="noopener" class="s-link-btn s-link-btn-yahoo">📊 Yahoo Finance</a>` : ''}
        ${bUrl ? `<a href="${esc(bUrl)}" target="_blank" rel="noopener" class="s-link-btn s-link-btn-bbs">💬 Y!掲示板</a>` : ''}
      </div>
      <div class="s-price-bar" id="price-bar" style="width:100%">
        <div class="s-price-loading"><div class="s-spinner" style="width:14px;height:14px;border-width:2px"></div> 株価を取得中...</div>
      </div>`;
    area.appendChild(hdr);

    // Fetch live price asynchronously (non-blocking)
    fetchLivePrice(data.ticker, data.country);

    // Metrics
    const metLabel = document.createElement('div');
    metLabel.className = 's-section-label';
    metLabel.textContent = '財務指標';
    area.appendChild(metLabel);

    const grid = document.createElement('div');
    grid.className = 's-metrics-grid';

    for (const [key, def] of Object.entries(METRIC_DEFS)) {
      const mv = m[key];
      const val = mv?.value ?? null;
      const asof = mv?.as_of || '';
      const unit = mv?.unit || def.unit || '';

      let ratingClass = 'na';
      let ratingLabel = 'N/A';
      if (val !== null) {
        if (def.isGood(val)) { ratingClass = 'good'; ratingLabel = '優良'; }
        else if (def.isWarn(val)) { ratingClass = 'warn'; ratingLabel = '標準'; }
        else if (def.isBad(val)) { ratingClass = 'bad'; ratingLabel = '注意'; }
        else { ratingClass = 'na'; ratingLabel = '参考'; }
      }

      const dispVal = def.formatVal ? def.formatVal(val, unit) : (val != null ? val : 'N/A');
      const dispUnit = def.getUnit ? def.getUnit(unit) : def.unit;

      // Special handling for market_cap/revenue: show formatted unit
      let unitDisplay = def.unit;
      if (key === 'market_cap' || key === 'revenue') {
        unitDisplay = def.getUnit(unit);
        // If value was reformatted (e.g., "40.0兆"), don't show unit separately when it's embedded
        // we'll just show it inline
      }

      // For large values that were reformatted to include 兆/T/B, clear the separate unit
      const isLarge = (key === 'market_cap' || key === 'revenue') && dispVal !== 'N/A' && (dispVal.includes('兆') || dispVal.includes('T') || dispVal.includes('B'));

      const card = document.createElement('div');
      card.className = `s-metric-card rating-${ratingClass === 'na' ? 'na' : ratingClass}`;
      card.dataset.key = key;
      card.innerHTML = `
        <div class="s-metric-top">
          <div class="s-metric-name">${esc(def.name)} <span class="s-metric-chevron" id="chev-${key}">▼</span></div>
          <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
            <span class="s-metric-source" id="ms-${key}">AI推定</span>
            <span class="s-metric-rating ${ratingClass}" id="mr-${key}">${ratingLabel !== 'N/A' ? ratingLabel : '参考'}</span>
          </div>
        </div>
        <div class="s-metric-value" id="mv-${key}">
          ${esc(dispVal)}<span class="s-metric-unit">${isLarge ? '' : esc(unitDisplay || def.unit)}</span>
        </div>
        <div class="s-metric-asof" id="ma-${key}">${asof ? esc(asof) : ''}</div>
        <div class="s-metric-expand">
          <div class="s-metric-full-name">${esc(def.fullName)}</div>
          <div class="s-metric-desc">${esc(def.desc)}</div>
          <div class="s-metric-bench">${esc(def.bench)}</div>
        </div>`;
      card.addEventListener('click', () => toggleMetric(key));
      grid.appendChild(card);
    }

    area.appendChild(grid);

    // Analysis
    if (data.analysis || (data.strengths && data.strengths.length) || (data.risks && data.risks.length)) {
      const anaLabel = document.createElement('div');
      anaLabel.className = 's-section-label';
      anaLabel.textContent = 'AI 分析';
      area.appendChild(anaLabel);

      const anaCard = document.createElement('div');
      anaCard.className = 's-analysis-card';

      if (data.analysis) {
        const atxt = document.createElement('div');
        atxt.className = 's-analysis-text';
        atxt.textContent = data.analysis;
        anaCard.appendChild(atxt);
      }

      if ((data.strengths && data.strengths.length) || (data.risks && data.risks.length)) {
        const srGrid = document.createElement('div');
        srGrid.className = 's-str-risk-grid';

        if (data.strengths && data.strengths.length) {
          const strPanel = document.createElement('div');
          strPanel.className = 's-str-panel';
          strPanel.innerHTML = `<div class="s-str-title">✓ 強み</div>` +
            data.strengths.map(s => `<div class="s-str-item">✓ ${esc(s)}</div>`).join('');
          srGrid.appendChild(strPanel);
        }

        if (data.risks && data.risks.length) {
          const riskPanel = document.createElement('div');
          riskPanel.className = 's-risk-panel';
          riskPanel.innerHTML = `<div class="s-risk-title">⚠ リスク</div>` +
            data.risks.map(r => `<div class="s-risk-item">⚠ ${esc(r)}</div>`).join('');
          srGrid.appendChild(riskPanel);
        }

        anaCard.appendChild(srGrid);
      }

      area.appendChild(anaCard);
    }

    // History placeholder (populated by loadRealData)
    const histSection = document.createElement('div');
    histSection.id = 'history-section';
    histSection.innerHTML = `<div class="s-hist-loading"><div class="s-spinner" style="width:14px;height:14px;border-width:2px"></div> 実績データを取得中...</div>`;
    area.appendChild(histSection);

    area.classList.remove('hidden');

    // Load real data (non-blocking)
    const avKey2 = localStorage.getItem(AV_KEY_STORAGE);
    loadRealData(data.ticker, data.country, avKey2 || '');
  }

  // ===== Live Price (Alpha Vantage) =====
  async function fetchLivePrice(ticker, country) {
    const bar = document.getElementById('price-bar');
    if (!bar) return;

    const avKey = localStorage.getItem(AV_KEY_STORAGE);
    if (!avKey) {
      bar.innerHTML = `<div class="s-price-no-key">株価を表示するには <a onclick="toggleSettings()">⚙ 設定</a> から Alpha Vantage API キーを登録してください（<a href="https://www.alphavantage.co/support/#api-key" target="_blank" rel="noopener">無料取得</a>）</div>`;
      return;
    }

    // Build Alpha Vantage symbol
    let symbol = buildAVSymbol(ticker, country);

    try {
      const url = `https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${encodeURIComponent(symbol)}&apikey=${encodeURIComponent(avKey)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();

      if (json['Note'] || json['Information']) {
        // Rate limit hit
        bar.innerHTML = `<div class="s-price-no-key">⚠ API制限中（25回/日）。しばらく後でお試しください。</div>`;
        return;
      }

      const q = json['Global Quote'];
      if (!q || !q['05. price']) {
        bar.innerHTML = `<div class="s-price-no-key">株価データが見つかりませんでした（${esc(symbol)}）</div>`;
        return;
      }

      const price = parseFloat(q['05. price']);
      const change = parseFloat(q['09. change']);
      const pctStr = q['10. change percent'] || '0%';
      const pct = parseFloat(pctStr.replace('%', ''));
      const low = parseFloat(q['04. low']);
      const high = parseFloat(q['03. high']);
      const vol = parseInt(q['06. volume'], 10);
      const prevClose = parseFloat(q['08. previous close']);
      const latestDay = q['07. latest trading day'] || '';

      const isJP = country === 'JP';
      if (isJP) { latestJPPrice = price; tryUpdatePERPBR(); }
      const currencyLabel = isJP ? '円' : 'USD';
      const fmt = (v, decimals) => isJP
        ? Math.round(v).toLocaleString('ja-JP')
        : v.toFixed(decimals ?? 2);

      const changeClass = change > 0 ? 'up' : change < 0 ? 'down' : 'flat';
      const changeSign = change > 0 ? '+' : '';

      bar.innerHTML = `
        <div class="s-price-main">
          <div class="s-price-value">${esc(fmt(price))}</div>
          <div class="s-price-currency">${esc(currencyLabel)}</div>
          <div class="s-price-change ${changeClass}">${changeSign}${esc(fmt(change))} (${changeSign}${esc(pct.toFixed(2))}%)</div>
        </div>
        <div class="s-price-meta">
          ${!isNaN(prevClose) ? `<div class="s-price-meta-item">前日終値<span>${esc(fmt(prevClose))}</span></div>` : ''}
          ${!isNaN(low) && !isNaN(high) ? `<div class="s-price-meta-item">日中レンジ<span>${esc(fmt(low))} – ${esc(fmt(high))}</span></div>` : ''}
          ${!isNaN(vol) ? `<div class="s-price-meta-item">出来高<span>${(vol / 1000).toFixed(0)}K</span></div>` : ''}
          ${latestDay ? `<div class="s-price-meta-item">最終取引日<span>${esc(latestDay)}</span></div>` : ''}
        </div>
        <div class="s-price-live">LIVE</div>`;
    } catch (e) {
      bar.innerHTML = `<div class="s-price-no-key">株価取得エラー: ${esc(e.message)}</div>`;
    }
  }

  // ===== Alpha Vantage helpers =====
  function buildAVSymbol(ticker, country) {
    let s = (ticker || '').trim().replace(/\.(T|TYO|JP|JT)$/i, '');
    if (country === 'JP' && /^\d{4,5}$/.test(s)) s = s + '.T';
    return s;
  }

  async function fetchAV(func, symbol, avKey) {
    const url = `https://www.alphavantage.co/query?function=${func}&symbol=${encodeURIComponent(symbol)}&apikey=${encodeURIComponent(avKey)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json['Note'] || json['Information']) throw new Error('API制限中（25回/日）');
    return json;
  }

  // ===== Load Real Data =====
  async function loadRealData(ticker, country, avKey) {
    const histSection = document.getElementById('history-section');

    if (country === 'JP') {
      // JP: Yahoo Finance (via CORS proxy) for fundamentals + history
      await loadRealDataJP(ticker, histSection);
    } else {
      // US: Alpha Vantage for fundamentals + history
      if (!avKey) {
        if (histSection) histSection.innerHTML = `<div class="s-hist-na">Alpha Vantage APIキーを設定すると実績データが表示されます。</div>`;
        return;
      }
      await loadRealDataUS(ticker, avKey, histSection);
    }
  }

  async function loadRealDataUS(ticker, avKey, histSection) {
    const fmpKey = localStorage.getItem(FMP_KEY_STORAGE);
    if (fmpKey) {
      // Prefer FMP for US too (richer history, no AV call waste)
      try {
        const [ratiosRes, incRes, cfRes, bsRes] = await Promise.allSettled([
          fetchFMP(`ratios-ttm/${ticker}`, fmpKey),
          fetchFMP(`income-statement/${ticker}?period=annual&limit=15`, fmpKey),
          fetchFMP(`cash-flow-statement/${ticker}?period=annual&limit=15`, fmpKey),
          fetchFMP(`balance-sheet-statement/${ticker}?period=annual&limit=1`, fmpKey),
        ]);
        if (ratiosRes.status === 'fulfilled' && Array.isArray(ratiosRes.value) && ratiosRes.value[0]) {
          const bs0 = (bsRes.status === 'fulfilled' && Array.isArray(bsRes.value)) ? bsRes.value[0] : null;
          applyFMPRatios(ratiosRes.value[0], bs0);
        }
        const incData = (incRes.status === 'fulfilled' && Array.isArray(incRes.value)) ? incRes.value : null;
        const cfData  = (cfRes.status  === 'fulfilled' && Array.isArray(cfRes.value))  ? cfRes.value  : null;
        if (incData?.length || cfData?.length) { renderHistoryFMP(incData, cfData, histSection); return; }
      } catch (_) {}
    }
    // Fallback: Alpha Vantage
    if (!avKey) { if (histSection) histSection.innerHTML = `<div class="s-hist-na">FMPまたはAVキーを設定すると実績データが表示されます。</div>`; return; }
    try {
      const [ovRes, incRes, cfRes] = await Promise.allSettled([
        fetchAV('COMPANY_OVERVIEW', ticker, avKey),
        fetchAV('INCOME_STATEMENT', ticker, avKey),
        fetchAV('CASH_FLOW', ticker, avKey),
      ]);
      if (ovRes.status === 'fulfilled' && ovRes.value?.['Symbol']) applyRealMetrics(ovRes.value);
      const incData = incRes.status === 'fulfilled' ? incRes.value : null;
      const cfData  = cfRes.status  === 'fulfilled' ? cfRes.value  : null;
      if (incData || cfData) { renderHistory(incData, cfData, histSection); }
      else { if (histSection) histSection.innerHTML = `<div class="s-hist-na">履歴データを取得できませんでした（API制限 25回/日）。</div>`; }
    } catch (e) {
      if (histSection) histSection.innerHTML = `<div class="s-hist-na">実績データ取得エラー: ${esc(e.message)}</div>`;
    }
  }

  // ===== J-Quants V2 (JP stocks) =====
  async function jqRequest(url, opts = {}) {
    try {
      const r = await fetch(url, opts);
      if (r.ok) return r.json();
      if (r.status !== 0) throw new Error(`HTTP ${r.status}`);
    } catch (e) {
      if (!e.message.startsWith('HTTP')) {
        const r2 = await fetch(CORS_PROXY + encodeURIComponent(url), opts);
        if (!r2.ok) throw new Error(`HTTP ${r2.status}`);
        return r2.json();
      }
      throw e;
    }
    throw new Error('J-Quants request failed');
  }

  function saveJQApiKey() {
    const key = document.getElementById('jq-api-key-input').value.trim();
    const status = document.getElementById('jq-status');
    if (!key) { status.textContent = 'APIキーを入力してください'; status.style.color = 'var(--red)'; return; }
    localStorage.setItem(JQ_API_KEY_STORAGE, key);
    document.getElementById('jq-api-key-input').value = '';
    status.textContent = '✓ 保存済み'; status.style.color = 'var(--green)';
  }

  async function loadRealDataJP(ticker, histSection) {
    const apiKey = localStorage.getItem(JQ_API_KEY_STORAGE);
    if (!apiKey) {
      if (histSection) histSection.innerHTML = `<div class="s-hist-na">
        日本株の財務実績を表示するには ⚙ 設定 から
        <a href="https://jpx-jquants.com/" target="_blank" rel="noopener" style="color:var(--accent)">J-Quants</a>（JPX公式・無料）の
        APIキーを設定してください（設定メニュー「API Key」からコピー）。
      </div>`;
      return;
    }
    const code = ticker.replace(/\.(T|TYO|JP)$/i, '');
    try {
      const res = await jqRequest(
        `${JQUANTS_BASE}/fins/summary?code=${encodeURIComponent(code)}`,
        { headers: { 'x-api-key': apiKey } }
      );
      const records = res?.data || [];
      if (records.length === 0) {
        if (histSection) histSection.innerHTML = `<div class="s-hist-na">財務データが見つかりませんでした（コード: ${esc(code)}）</div>`;
        return;
      }
      applyJQuantsMetrics(records);
      renderJQuantsHistory(records, histSection);
    } catch (e) {
      if (histSection) histSection.innerHTML = `<div class="s-hist-na">J-Quants取得エラー: ${esc(e.message)}</div>`;
    }
  }

  function jqAnnual(records) {
    return records
      .filter(r => r.DocType && r.DocType.startsWith('FY'))
      .sort((a, b) => (b.DiscDate || '').localeCompare(a.DiscDate || ''));
  }

  function applyJQuantsMetrics(records) {
    const annual = jqAnnual(records);
    if (!annual.length) return;
    const s  = annual[0];
    const pf = v => { const n = Number(v); return (!isNaN(n) && n !== 0) ? n : null; };

    const netSales  = pf(s.Sales), opProfit = pf(s.OP);
    const profit    = pf(s.NP),    equity   = pf(s.Eq), totalAssets = pf(s.TA);
    const eqAR      = pf(s.EqAR);

    jqEPS = pf(s.EPS);
    jqBPS = pf(s.BPS);
    jqDPS = pf(s.DivAnn);

    const metrics = {
      roe:              profit && equity      && equity > 0      ? profit / equity      * 100 : null,
      roa:              profit && totalAssets && totalAssets > 0 ? profit / totalAssets * 100 : null,
      operating_margin: opProfit && netSales  && netSales > 0    ? opProfit / netSales  * 100 : null,
      equity_ratio:     eqAR != null ? (eqAR > 1 ? eqAR : eqAR * 100)
                         : (equity && totalAssets && totalAssets > 0 ? equity / totalAssets * 100 : null),
      revenue:          netSales != null ? Math.round(netSales / 1e8) : null,
    };
    for (const [key, value] of Object.entries(metrics)) {
      if (value == null) continue;
      updateMetricCard(key, value, key === 'revenue' ? '億円' : '%', 'J-Quants');
    }
    tryUpdatePERPBR();
  }

  function tryUpdatePERPBR() {
    if (latestJPPrice == null) return;
    if (jqEPS && jqEPS > 0) updateMetricCard('per', latestJPPrice / jqEPS, '倍', 'J-Quants');
    if (jqBPS && jqBPS > 0) updateMetricCard('pbr', latestJPPrice / jqBPS, '倍', 'J-Quants');
    if (jqDPS && latestJPPrice > 0) updateMetricCard('dividend_yield', jqDPS / latestJPPrice * 100, '%', 'J-Quants');
  }

  function renderJQuantsHistory(records, section) {
    const annual = jqAnnual(records).slice(0, 15).reverse();
    if (!annual.length) { section.innerHTML = `<div class="s-hist-na">年次データが見つかりませんでした</div>`; return; }

    const fakeInc = { annualReports: annual.map(s => ({
      fiscalDateEnding: s.DiscDate || '',
      totalRevenue:    Number(s.Sales) || null,
      netIncome:       Number(s.NP)   || null,
      operatingIncome: Number(s.OP)   || null,
    })) };

    const fakeCf = { annualReports: annual.map(s => {
      const eps = Number(s.EPS)    || null;
      const dps = Number(s.DivAnn) || null;
      const ni  = Number(s.NP)     || null;
      const dp  = (eps && dps && ni && eps > 0) ? ni * (dps / eps) : null;
      return { fiscalDateEnding: s.DiscDate || '', dividendPayout: dp };
    }) };

    renderHistory(fakeInc, fakeCf, section, '業績・配当性向推移（J-Quants V2 · 最大15年）');
  }

  async function fetchFMP(path, apiKey) {
    const sep = path.includes('?') ? '&' : '?';
    const url = `https://financialmodelingprep.com/api/v3/${path}${sep}apikey=${encodeURIComponent(apiKey)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json['Error Message']) throw new Error(json['Error Message']);
    return json;
  }

  function applyFMPRatios(r, bs) {
    const pf = v => (v != null && !isNaN(Number(v)) && Number(v) !== 0) ? Number(v) : null;

    let equityRatio = null;
    if (bs?.totalAssets && bs?.totalStockholdersEquity) {
      equityRatio = (bs.totalStockholdersEquity / bs.totalAssets) * 100;
    }

    const mapping = {
      per:              { value: pf(r.peRatioTTM),                                                       unit: '倍' },
      pbr:              { value: pf(r.priceToBookRatioTTM),                                               unit: '倍' },
      roe:              { value: pf(r.returnOnEquityTTM)        != null ? pf(r.returnOnEquityTTM)        * 100 : null, unit: '%' },
      roa:              { value: pf(r.returnOnAssetsTTM)        != null ? pf(r.returnOnAssetsTTM)        * 100 : null, unit: '%' },
      equity_ratio:     { value: equityRatio,                                                              unit: '%' },
      operating_margin: { value: pf(r.operatingProfitMarginTTM) != null ? pf(r.operatingProfitMarginTTM) * 100 : null, unit: '%' },
      dividend_yield:   { value: pf(r.dividendYieldTTM)         != null ? pf(r.dividendYieldTTM)         * 100 : null, unit: '%' },
    };

    for (const [key, d] of Object.entries(mapping)) {
      if (d.value == null || isNaN(d.value)) continue;
      updateMetricCard(key, d.value, d.unit, 'FMP');
    }
  }

  function renderHistoryFMP(incomeList, cfList, section) {
    const toMap = (arr, dateKey, fn) => {
      const m = {};
      (arr || []).forEach(r => { const y = (r[dateKey] || '').substring(0, 4); if (y) m[y] = fn(r); });
      return m;
    };

    const incomeMap = toMap(incomeList, 'date', r => ({ revenue: r.revenue ?? null, netIncome: r.netIncome ?? null }));
    const cfMap     = toMap(cfList,    'date', r => ({ dividends: r.dividendsPaid != null ? Math.abs(r.dividendsPaid) : null }));

    const fakeInc = { annualReports: Object.entries(incomeMap).map(([y, v]) => ({ fiscalDateEnding: y + '-12-31', totalRevenue: v.revenue, netIncome: v.netIncome, operatingIncome: null })) };
    const fakeCf  = { annualReports: Object.entries(cfMap).map(([y, v])    => ({ fiscalDateEnding: y + '-12-31', dividendPayout: v.dividends })) };

    renderHistory(fakeInc, fakeCf, section, '業績・配当性向推移（FMP · 最大15年）');
  }

  // ===== Apply real metrics from COMPANY_OVERVIEW =====
  function applyRealMetrics(ov) {
    const pf = s => { const v = parseFloat(s); return isNaN(v) ? null : v; };
    const mapping = {
      per:              { value: pf(ov['PERatio']),                         unit: '倍',    asof: 'TTM' },
      pbr:              { value: pf(ov['PriceToBookRatio']),                 unit: '倍',    asof: 'TTM' },
      roe:              { value: pf(ov['ReturnOnEquityTTM'])     != null ? pf(ov['ReturnOnEquityTTM'])     * 100 : null, unit: '%', asof: 'TTM' },
      roa:              { value: pf(ov['ReturnOnAssetsTTM'])     != null ? pf(ov['ReturnOnAssetsTTM'])     * 100 : null, unit: '%', asof: 'TTM' },
      operating_margin: { value: pf(ov['OperatingMarginTTM'])    != null ? pf(ov['OperatingMarginTTM'])    * 100 : null, unit: '%', asof: 'TTM' },
      dividend_yield:   { value: pf(ov['DividendYield'])         != null ? pf(ov['DividendYield'])         * 100 : null, unit: '%', asof: '直近' },
      market_cap:       { value: pf(ov['MarketCapitalization'])  != null ? Math.round(pf(ov['MarketCapitalization'])  / 1e6) : null, unit: '百万ドル', asof: '現在' },
      revenue:          { value: pf(ov['RevenueTTM'])            != null ? Math.round(pf(ov['RevenueTTM'])            / 1e6) : null, unit: '百万ドル', asof: 'TTM'  },
    };
    for (const [key, d] of Object.entries(mapping)) {
      if (d.value == null || isNaN(d.value)) continue;
      updateMetricCard(key, d.value, d.unit, d.asof);
    }
  }

  function updateMetricCard(key, value, unit, asof) {
    const def = METRIC_DEFS[key];
    if (!def) return;
    const valEl    = document.getElementById(`mv-${key}`);
    const asofEl   = document.getElementById(`ma-${key}`);
    const ratingEl = document.getElementById(`mr-${key}`);
    const sourceEl = document.getElementById(`ms-${key}`);
    const card     = document.querySelector(`[data-key="${key}"]`);
    if (!valEl) return;

    const dispVal = def.formatVal ? def.formatVal(value, unit) : value.toFixed(2);
    const dispUnit = def.getUnit ? def.getUnit(unit) : (def.unit || unit);
    const isLarge = (key === 'market_cap' || key === 'revenue') && dispVal !== 'N/A' &&
      (dispVal.includes('兆') || dispVal.includes('T') || dispVal.includes('B'));

    valEl.innerHTML = `${esc(dispVal)}<span class="s-metric-unit">${isLarge ? '' : esc(dispUnit)}</span>`;
    if (asofEl) asofEl.textContent = asof || '';

    let rc = 'na', rl = '参考';
    if (def.isGood(value))      { rc = 'good'; rl = '優良'; }
    else if (def.isWarn(value)) { rc = 'warn'; rl = '標準'; }
    else if (def.isBad(value))  { rc = 'bad';  rl = '注意'; }
    if (ratingEl) { ratingEl.className = `s-metric-rating ${rc}`; ratingEl.textContent = rl; }
    if (card) card.className = card.className.replace(/rating-\w+/, `rating-${rc}`);
    if (sourceEl) { sourceEl.textContent = '実データ'; sourceEl.className = 's-metric-source real'; }
  }

  // ===== Render History =====
  function renderHistory(incData, cfData, section, sectionTitle) {
    if (!section) return;
    section.innerHTML = '';

    const incomeMap = {};
    ((incData?.annualReports) || []).forEach(r => {
      const yr = r.fiscalDateEnding?.substring(0, 4);
      if (!yr) return;
      incomeMap[yr] = {
        revenue:    parseFloat(r.totalRevenue)    || null,
        netIncome:  parseFloat(r.netIncome)       || null,
        opIncome:   parseFloat(r.operatingIncome) || null,
      };
    });

    const cfMap = {};
    ((cfData?.annualReports) || []).forEach(r => {
      const yr = r.fiscalDateEnding?.substring(0, 4);
      if (!yr) return;
      cfMap[yr] = { dividends: Math.abs(parseFloat(r.dividendPayout)) || null };
    });

    const allYears = [...new Set([...Object.keys(incomeMap), ...Object.keys(cfMap)])]
      .filter(y => /^\d{4}$/.test(y)).sort().slice(-15);

    if (allYears.length === 0) {
      section.innerHTML = `<div class="s-hist-na">履歴データが見つかりませんでした</div>`;
      return;
    }

    const revenues   = allYears.map(y => incomeMap[y]?.revenue   ?? null);
    const netIncomes = allYears.map(y => incomeMap[y]?.netIncome  ?? null);
    const dividends  = allYears.map(y => cfMap[y]?.dividends      ?? null);
    const payouts    = allYears.map((_, i) => {
      const d = dividends[i], n = netIncomes[i];
      return (d != null && n != null && n > 0) ? Math.min((d / n) * 100, 300) : null;
    });

    const label = document.createElement('div');
    label.className = 's-section-label';
    label.textContent = sectionTitle || '業績・配当性向推移（Alpha Vantage · 最大15年）';
    section.appendChild(label);

    const card = document.createElement('div');
    card.className = 's-analysis-card';

    // Chart
    const chartDiv = document.createElement('div');
    chartDiv.className = 's-hist-chart';
    card.appendChild(chartDiv);
    chartDiv.innerHTML = buildSVGChart(allYears, netIncomes, payouts);

    // Legend
    const leg = document.createElement('div');
    leg.className = 's-hist-legend';
    leg.innerHTML = `
      <span class="s-legend-item"><span class="s-legend-bar" style="background:#58a6ff"></span>純利益</span>
      <span class="s-legend-item"><span class="s-legend-line" style="background:#d29922;height:2px"></span>配当性向%</span>`;
    card.appendChild(leg);

    // Table
    const fmtV = v => {
      if (v == null) return '—';
      const abs = Math.abs(v);
      if (abs >= 1e12) return `${(v/1e12).toFixed(2)}T`;
      if (abs >= 1e9)  return `${(v/1e9).toFixed(1)}B`;
      if (abs >= 1e6)  return `${(v/1e6).toFixed(0)}M`;
      return v.toLocaleString();
    };
    const fmtP = v => v == null ? '—' : `${v.toFixed(1)}%`;

    const wrap = document.createElement('div');
    wrap.className = 's-hist-table-wrap';

    let html = `<table class="s-hist-table">
      <thead><tr>
        <th>年度</th><th>売上高</th><th>純利益</th><th>総配当</th><th>配当性向</th>
      </tr></thead><tbody>`;

    [...allYears].reverse().forEach((yr, ri) => {
      const i = allYears.length - 1 - ri;
      const p = payouts[i];
      const pc = p == null ? '' : p > 100 ? 'bad' : p > 60 ? 'warn' : p > 0 ? 'good' : '';
      html += `<tr>
        <td>${yr}</td>
        <td>${fmtV(revenues[i])}</td>
        <td>${fmtV(netIncomes[i])}</td>
        <td>${fmtV(dividends[i])}</td>
        <td class="${pc}">${fmtP(p)}</td>
      </tr>`;
    });

    html += `</tbody></table>`;
    wrap.innerHTML = html;
    card.appendChild(wrap);
    section.appendChild(card);
  }

  // ===== SVG Chart =====
  function buildSVGChart(years, netIncomes, payouts) {
    const W = 700, H = 210;
    const pL = 52, pR = 52, pT = 12, pB = 32;
    const cW = W - pL - pR, cH = H - pT - pB;
    const n = years.length;

    const validInc = netIncomes.filter(v => v != null && v > 0);
    const maxInc = validInc.length ? Math.max(...validInc) : 1;
    const validPay = payouts.filter(v => v != null);
    const maxPay = validPay.length ? Math.max(100, Math.max(...validPay)) : 100;
    const barW = Math.max(6, Math.min(30, cW / n * 0.55));

    let bars = '', lines = '', dots = '', xLbls = '', yL = '', yR = '';

    years.forEach((yr, i) => {
      const cx = pL + (i + 0.5) * (cW / n);

      if (netIncomes[i] != null && netIncomes[i] > 0) {
        const bh = Math.max(2, (netIncomes[i] / maxInc) * cH);
        bars += `<rect x="${(cx - barW/2).toFixed(1)}" y="${(pT + cH - bh).toFixed(1)}" width="${barW}" height="${bh.toFixed(1)}" fill="#58a6ff" fill-opacity="0.75" rx="2"/>`;
      }

      if (payouts[i] != null) {
        const py = pT + cH - (Math.min(payouts[i], maxPay) / maxPay) * cH;
        let pi = i - 1;
        while (pi >= 0 && payouts[pi] == null) pi--;
        if (pi >= 0) {
          const px = pL + (pi + 0.5) * (cW / n);
          const ppy = pT + cH - (Math.min(payouts[pi], maxPay) / maxPay) * cH;
          lines += `<line x1="${px.toFixed(1)}" y1="${ppy.toFixed(1)}" x2="${cx.toFixed(1)}" y2="${py.toFixed(1)}" stroke="#d29922" stroke-width="2.5" stroke-opacity="0.9"/>`;
        }
        dots += `<circle cx="${cx.toFixed(1)}" cy="${py.toFixed(1)}" r="3.5" fill="#d29922" stroke="#0d1117" stroke-width="1"/>`;
      }

      if (n <= 8 || i % Math.ceil(n / 8) === 0 || i === n - 1) {
        xLbls += `<text x="${cx.toFixed(1)}" y="${H - pB + 14}" text-anchor="middle" font-size="9" fill="#6e7681">${yr}</text>`;
      }
    });

    for (let j = 0; j <= 4; j++) {
      const v = maxInc * j / 4;
      const y = (pT + cH - j / 4 * cH).toFixed(1);
      const lbl = v >= 1e12 ? `${(v/1e12).toFixed(1)}T` : v >= 1e9 ? `${(v/1e9).toFixed(0)}B` : v >= 1e6 ? `${(v/1e6).toFixed(0)}M` : '0';
      yL += `<text x="${pL - 4}" y="${(+y + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="#6e7681">${lbl}</text>`;
    }

    [0, 25, 50, 75, 100].forEach(pct => {
      const y = pT + cH - (pct / maxPay) * cH;
      if (y < pT || y > pT + cH + 2) return;
      yR += `<text x="${W - pR + 4}" y="${(y + 3).toFixed(1)}" text-anchor="start" font-size="9" fill="#d29922">${pct}%</text>`;
    });

    let grid = '';
    for (let j = 0; j <= 4; j++) {
      const y = (pT + j / 4 * cH).toFixed(1);
      grid += `<line x1="${pL}" y1="${y}" x2="${W - pR}" y2="${y}" stroke="#21262d" stroke-width="1"/>`;
    }

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px">
      <defs><clipPath id="cc"><rect x="${pL}" y="${pT}" width="${cW}" height="${cH}"/></clipPath></defs>
      ${grid}
      <g clip-path="url(#cc)">${bars}${lines}${dots}</g>
      <line x1="${pL}" y1="${pT}" x2="${pL}" y2="${pT + cH}" stroke="#30363d"/>
      <line x1="${pL}" y1="${pT + cH}" x2="${W - pR}" y2="${pT + cH}" stroke="#30363d"/>
      <line x1="${W - pR}" y1="${pT}" x2="${W - pR}" y2="${pT + cH}" stroke="#30363d" stroke-dasharray="3,3" stroke-opacity="0.5"/>
      ${xLbls}${yL}${yR}
    </svg>`;
  }

  function toggleMetric(key) {
    const card = document.querySelector(`[data-key="${key}"]`);
    const chev = document.getElementById(`chev-${key}`);
    if (!card) return;

    if (card.classList.contains('expanded')) {
      card.classList.remove('expanded');
      if (chev) chev.textContent = '▼';
      expandedMetric = null;
    } else {
      // close previous
      if (expandedMetric) {
        const prev = document.querySelector(`[data-key="${expandedMetric}"]`);
        const prevChev = document.getElementById(`chev-${expandedMetric}`);
        if (prev) prev.classList.remove('expanded');
        if (prevChev) prevChev.textContent = '▼';
      }
      card.classList.add('expanded');
      if (chev) chev.textContent = '▲';
      expandedMetric = key;
    }
  }

  // ===== UI helpers =====
  function showStatus(msg, isError = false) {
    const box = document.getElementById('status-box');
    const spinner = document.getElementById('status-spinner');
    const text = document.getElementById('status-text');
    text.textContent = msg;
    spinner.style.display = isError ? 'none' : 'block';
    box.className = 's-status' + (isError ? ' s-error' : '');
    box.classList.remove('hidden');
  }

  function showError(msg) {
    showStatus(msg, true);
  }

  function hideStatus() {
    document.getElementById('status-box').classList.add('hidden');
  }

  function esc(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  </script>
</body>
